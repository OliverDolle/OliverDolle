<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Terminal window introducing Oliver">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #8B949E; }
    .prompt { fill: #33FF33; }
    .cmd { fill: #E6EDF3; }
    .out { fill: #8B949E; }
    .line { opacity: 0; animation: show .4s ease-out forwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: .9s; }
    .l3 { animation-delay: 1.2s; }
    .l4 { animation-delay: 1.9s; }
    .l5 { animation-delay: 2.5s; }
    .l6 { animation-delay: 3.1s; }
    .cursor { animation: blink 1s infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="718" height="248" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 11 a10 10 0 0 1 10 -10 h698 a10 10 0 0 1 10 10 v26 h-718 z" fill="#161B22"/>
  <line x1="1" y1="37" x2="719" y2="37" stroke="#30363D" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="19" r="6" fill="#27C93F"/>
  <text class="title" x="360" y="23" text-anchor="middle">oliver@dtu: ~</text>

  <text class="mono line l1" x="24" y="74"><tspan class="prompt">oliver@dtu:~$</tspan><tspan class="cmd" dx="10">whoami</tspan></text>
  <text class="mono line l2 out" x="24" y="102">Oliver, Software Technology student at DTU</text>
  <text class="mono line l3 out" x="24" y="130">Student Assistant, AI &amp; Automation at NTG</text>
  <text class="mono line l4" x="24" y="166"><tspan class="prompt">oliver@dtu:~$</tspan><tspan class="cmd" dx="10">cat interests.txt</tspan></text>
  <text class="mono line l5 out" x="24" y="194">embedded systems, agentic workflows, harnesses, automation</text>
  <text class="mono line l6" x="24" y="230"><tspan class="prompt">oliver@dtu:~$</tspan><tspan class="cmd cursor" dx="10">█</tspan></text>
</svg>
